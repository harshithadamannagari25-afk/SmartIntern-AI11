<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartIntern AI - Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="phone-container">

    <h3 class="fw-bold">👤 Student Profile</h3>
    <p class="text-muted">Complete your profile and upload your resume.</p>

    <div class="card dashboard-card">

        <label class="mb-2"><strong>Full Name</strong></label>
        <input type="text" class="form-control mb-3" placeholder="Enter your name">

        <label class="mb-2"><strong>Email</strong></label>
        <input type="email" class="form-control mb-3" placeholder="Enter your email">

        <label class="mb-2"><strong>College</strong></label>
        <input type="text" class="form-control mb-3" placeholder="College Name">

        <label class="mb-2"><strong>Skills</strong></label>
        <input type="text" class="form-control mb-3" placeholder="Python, SQL, AI">

        <label class="mb-2"><strong>Upload Resume (PDF)</strong></label>
        <input type="file" class="form-control mb-4" accept=".pdf">

        <button class="login-btn w-100" onclick="saveProfile()">
            Save Profile
        </button>

    </div>

</div>

<script>
function saveProfile(){
    alert("✅ Profile Saved Successfully!");
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
