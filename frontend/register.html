<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Company Registration - SmartIntern AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="phone-container">

        <!-- Header -->
        <div class="text-center mb-4">

            <h2 class="fw-bold">
                🤖 SmartIntern AI
            </h2>

            <p class="text-muted">
                Company Registration
            </p>

        </div>


        <!-- Registration Card -->
        <div class="card dashboard-card">

            <h4 class="fw-bold mb-3">
                🏢 Create Company Account
            </h4>


            <!-- Company Name -->
            <div class="mb-3">

                <label class="form-label">
                    Company Name
                </label>

                <input
                    type="text"
                    id="company_name"
                    class="form-control"
                    placeholder="Enter company name"
                    required
                >

            </div>


            <!-- Email -->
            <div class="mb-3">

                <label class="form-label">
                    Company Email
                </label>

                <input
                    type="email"
                    id="company_email"
                    class="form-control"
                    placeholder="Enter company email"
                    required
                >

            </div>


            <!-- Password -->
            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    id="company_password"
                    class="form-control"
                    placeholder="Create password"
                    required
                >

            </div>


            <!-- Domain -->
            <div class="mb-3">

                <label class="form-label">
                    Company Domain
                </label>

                <select
                    id="company_domain"
                    class="form-select"
                >

                    <option value="">
                        Select domain
                    </option>

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="Finance">
                        Finance
                    </option>

                    <option value="Healthcare">
                        Healthcare
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Marketing">
                        Marketing
                    </option>

                    <option value="Data Science">
                        Data Science
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- Register Button -->
            <button
                class="gold-btn w-100"
                onclick="registerCompany()"
            >
                🏢 Register Company
            </button>


            <!-- Login -->
            <div class="text-center mt-3">

                <p class="mb-1">
                    Already have an account?
                </p>

                <a href="company-login.html">
                    Login here
                </a>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="js/company.js"></script>

</body>

</html>
