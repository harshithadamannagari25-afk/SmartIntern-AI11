<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartIntern AI - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="phone-container">

    <div class="text-center mt-4">

        <div class="logo-circle">
            🧠
        </div>

        <h2 class="mt-3 fw-bold">Create Account</h2>

        <p class="text-muted">
            Join SmartIntern AI
        </p>

    </div>

    <div class="login-card">

        <input id="full_name" class="form-control mb-3" placeholder="Full Name">

        <input id="email" type="email" class="form-control mb-3" placeholder="Email">

        <input id="college" class="form-control mb-3" placeholder="College">

        <input id="degree" class="form-control mb-3" placeholder="Degree">

        <input id="skills" class="form-control mb-3" placeholder="Skills (Python, SQL, Power BI)">

        <button class="btn login-btn w-100" onclick="registerStudent()">
            Register
        </button>

        <div class="text-center mt-4">

            Already have an account?

            <a href="login.html">Login</a>

        </div>

    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
