<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartIntern AI Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="phone-container">

        <h3 class="fw-bold" id="welcomeName">👋 Welcome</h3>

        <p class="text-muted">AI Powered Internship Recommendation</p>

        <!-- AI Match Score -->
        <div class="card dashboard-card">

            <h5>⭐ AI Match Score</h5>

            <h1 id="matchScore">0%</h1>

        </div>

        <!-- Resume Status -->
        <div class="card dashboard-card">

            <h5>📄 Resume Status</h5>

            <p id="resume-status">Not Uploaded</p>

            <button class="gold-btn" id="uploadBtn">
                Upload Resume
            </button>

        </div>

        <!-- My Applications -->
        <div class="card dashboard-card">

            <h5>📂 My Applications</h5>

            <button class="gold-btn"
                onclick="window.location.href='applications.html'">

                View Applications

            </button>

        </div>

        <!-- Recommended Internships -->
        <div class="card dashboard-card">

            <h5>🔥 Recommended Internships</h5>

            <div id="internship-list">

                Loading...

            </div>

        </div>

    </div>

    <script>
        document.getElementById("uploadBtn").addEventListener("click", function () {
            window.location.href = "profile.html";
        });
    </script>

    <script src="js/dashboard.js"></script>

</body>

</html>
